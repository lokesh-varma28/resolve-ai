version: "3.8"

services:
  backend:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - EXECUTION_MODE=llm_with_fallback
      - LLM_PROVIDER=gemini
      - GEMINI_MODEL=gemini-2.5-flash
    env_file:
      - ./ai-service/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
